name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (pinned to the matrix interpreter)
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Show interpreter actually used
        run: uv run python --version

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q --junitxml=pytest-report.xml

      - name: Package build check
        run: uv build

      - name: Notebook execution check
        if: matrix.python-version == '3.12'
        run: |
          uv run jupyter nbconvert --to notebook --execute --inplace \
            examples/01_gbm_iptw_from_raw_data.ipynb examples/02_joint_bootstrap.ipynb \
            examples/03_causal_ranking.ipynb examples/04_html_report.ipynb
          git diff --exit-code -- examples/ || \
            echo "notebook outputs changed; commit the regenerated notebooks"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report.xml
